<!doctype html>
<html>
  <head>
    <title>Belajar Div dan Span</title>
  </head>
  <body>
    <!-- Contoh div -->
    <div>
      <h2>Judul Card</h2>
      <p>Konten card...</p>
    </div>

    <!-- Contoh span -->
    <p>Harga: <span>Rp 100.000</span></p>

    <!-- Contoh div sebagai pengelompok konten -->
    <div>
      <h3>Sidebar</h3>
      <p>Menu 1</p>
      <p>Menu 2</p>
    </div>

    <div>
      <h3>Konten Utama</h3>
      <p>Ini adalah isi halaman.</p>
    </div>
  </body>
</html>
