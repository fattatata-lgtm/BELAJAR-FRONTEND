<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- Audio -->
     <h2>musik</h2>
    <audio controls>
      <source src="../assets/vn.ogg" type="audio/mpeg" />
      Browser tidak mendukung audio.
    </audio>
<br>
    <!-- Video -->
     <h2>tutorial flutter</h2>
    <video controls width="640" height="360">
      <source src="../assets/tutorflutter.mp4" type="video/mp4" />
      Browser tidak mendukung video.
    </video>
<br>
    <!-- YouTube Embed -->
     <h2>mukbang</h2>
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/P3_MImSD1LU?si=h08M9lOeAzAMTSCe"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </body>
</html>
