<!DOCTYPE html>
<html>
<head>
    <title>Progress & Meter</title>
</head>
<body>

    <h2>Progress Bar</h2>

    <progress value="70" max="100">
        70%
    </progress>

    <br><br>

    <h2>Meter</h2>

    <meter
        value="0.7"
        min="0"
        max="1"
        low="0.3"
        high="0.7"
        optimum="0.8">
        70%
    </meter>

    <br><br>

    <h2>Details & Summary</h2>

    <details>
        <summary>Klik untuk membuka</summary>

        <p>
            Ini adalah konten yang awalnya disembunyikan.
        </p>
    </details>

    <br>

    <h2>Datalist</h2>

    <input list="browsers" placeholder="Pilih browser">

    <datalist id="browsers">
        <option value="Chrome">
        <option value="Firefox">
        <option value="Safari">
        <option value="Edge">
    </datalist>

</body>
</html>
