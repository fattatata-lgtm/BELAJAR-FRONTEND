<!doctype html>
<html>
  <head>
    <title>Validasi Form HTML5</title>
  </head>
  <body>
    <h2>Form Pendaftaran</h2>

    <form>
      <label>Nama</label><br />
      <input type="text" required minlength="3" maxlength="50" /><br /><br />

      <label>Email</label><br />
      <input type="email" required /><br /><br />

      <label>Umur</label><br />
      <input type="number" min="1" max="100" step="1" /><br /><br />

      <label>Username</label><br />
      <input
        type="text"
        pattern="[A-Za-z]{3,}"
        title="Minimal 3 huruf"
      /><br /><br />

      <label>Website</label><br />
      <input type="url" placeholder="https://..." /><br /><br />

      <label>Nama Lengkap</label><br />
      <input type="text" autocomplete="name" /><br /><br />

      <input type="submit" value="Kirim" />
    </form>
  </body>
</html>
