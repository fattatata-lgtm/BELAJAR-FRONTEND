<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Dasar</title>

    <style>
      /* =========================
           RESET
        ========================== */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;

        background: #f4f4f4;

        padding: 20px;
      }

      h1 {
        text-align: center;

        margin-bottom: 30px;
      }

      h2 {
        margin: 30px 0 15px;
      }

      section {
        background: white;

        padding: 20px;

        margin-bottom: 25px;

        border-radius: 10px;

        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      /* =========================
           FLEX CONTAINER
        ========================== */

      .container {
        display: flex;

        flex-direction: row;

        justify-content: center;

        align-items: center;

        gap: 20px;

        flex-wrap: wrap;

        background: #eeeeee;

        padding: 20px;

        border-radius: 10px;
      }

      /* =========================
           FLEX ITEMS
        ========================== */

      .item {
        flex: 1;

        flex-grow: 1;

        flex-shrink: 0;

        flex-basis: 150px;

        background: #6c63ff;

        color: white;

        padding: 30px;

        text-align: center;

        border-radius: 8px;
      }

      .item2 {
        order: -1;

        align-self: flex-end;

        background: #ff9800;
      }

      .item3 {
        background: #4caf50;
      }
    </style>
  </head>
  <body>
    <h1>Flexbox Dasar</h1>

    <section>
      <h2>Flex Container</h2>

      <div class="container">
        <div class="item">Item 1</div>

        <div class="item item2">Item 2</div>

        <div class="item item3">Item 3</div>
      </div>
    </section>
  </body>
</html>
