<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Filters & Blend Modes</title>

    <style>
      /* =========================
           RESET
        ========================== */

      * {
        margin: 0;

        padding: 0;

        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;

        background: #f4f4f4;

        padding: 30px;

        line-height: 1.6;

        max-width: 1100px;

        margin: auto;
      }

      h1 {
        text-align: center;

        margin-bottom: 30px;
      }

      h2 {
        margin-bottom: 20px;
      }

      section {
        background: white;

        padding: 25px;

        margin-bottom: 30px;

        border-radius: 10px;

        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .gallery {
        display: flex;

        flex-wrap: wrap;

        gap: 20px;

        justify-content: center;
      }

      .card {
        width: 220px;

        text-align: center;
      }

      .card img {
        width: 100%;

        height: 160px;

        object-fit: cover;

        border-radius: 10px;

        margin-bottom: 10px;
      }

      /* =========================
           FILTERS
        ========================== */

      .blur {
        filter: blur(3px);
      }

      .brightness {
        filter: brightness(1.5);
      }

      .contrast {
        filter: contrast(200%);
      }

      .grayscale {
        filter: grayscale(100%);
      }

      .sepia {
        filter: sepia(100%);
      }

      .hue {
        filter: hue-rotate(90deg);
      }

      .shadow {
        filter: drop-shadow(5px 5px 10px black);
      }

      .multiple {
        filter: brightness(0.8) contrast(1.2);
      }

      /* =========================
           BLEND MODE
        ========================== */

      .blend-box {
        position: relative;

        width: 400px;

        margin: auto;
      }

      .blend-box img {
        width: 100%;

        display: block;

        border-radius: 10px;
      }

      .overlay {
        position: absolute;

        inset: 0;

        background: rgba(0, 0, 0, 0.5);

        mix-blend-mode: multiply;

        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <h1>CSS Filters & Blend Modes</h1>

    <section>
      <h2>1. CSS Filters</h2>

      <div class="gallery">
        <div class="card">
          <img class="blur" src="https://picsum.photos/300/200?1" alt="Blur" />
          <p>Blur</p>
        </div>

        <div class="card">
          <img
            class="brightness"
            src="https://picsum.photos/300/200?2"
            alt="Brightness"
          />
          <p>Brightness</p>
        </div>

        <div class="card">
          <img
            class="contrast"
            src="https://picsum.photos/300/200?3"
            alt="Contrast"
          />
          <p>Contrast</p>
        </div>

        <div class="card">
          <img
            class="grayscale"
            src="https://picsum.photos/300/200?4"
            alt="Grayscale"
          />
          <p>Grayscale</p>
        </div>

        <div class="card">
          <img
            class="sepia"
            src="https://picsum.photos/300/200?5"
            alt="Sepia"
          />
          <p>Sepia</p>
        </div>

        <div class="card">
          <img
            class="hue"
            src="https://picsum.photos/300/200?6"
            alt="Hue Rotate"
          />
          <p>Hue Rotate</p>
        </div>

        <div class="card">
          <img
            class="shadow"
            src="https://picsum.photos/300/200?7"
            alt="Drop Shadow"
          />
          <p>Drop Shadow</p>
        </div>

        <div class="card">
          <img
            class="multiple"
            src="https://picsum.photos/300/200?8"
            alt="Multiple Filters"
          />
          <p>Multiple Filters</p>
        </div>
      </div>
    </section>

    <section>
      <h2>2. Blend Mode</h2>

      <div class="blend-box">
        <img src="https://picsum.photos/600/300" alt="Blend Mode" />

        <div class="overlay"></div>
      </div>
    </section>
  </body>
</html>
